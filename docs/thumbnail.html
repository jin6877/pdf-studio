<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic",
          "Apple SD Gothic Neo", sans-serif;
      }
      .poster {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(1000px 500px at 82% -10%, rgba(242, 75, 56, 0.28), transparent 60%),
          radial-gradient(800px 600px at 0% 110%, rgba(37, 99, 235, 0.18), transparent 55%),
          linear-gradient(135deg, #0b1120 0%, #121a2e 55%, #0b1120 100%);
        color: #fff;
      }
      /* subtle grid texture */
      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(120deg, #000 25%, transparent 70%);
      }

      .left {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 600px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 3;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 34px;
      }
      .brand .mark {
        width: 56px;
        height: 56px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(242, 75, 56, 0.45);
      }
      .brand .name {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand .name b { color: #ff6b57; }

      h1 {
        font-size: 66px;
        line-height: 1.08;
        font-weight: 900;
        letter-spacing: -0.035em;
      }
      h1 .accent {
        color: #ff6b57;
        text-shadow: 0 6px 30px rgba(242, 75, 56, 0.5);
      }
      .tag {
        margin-top: 24px;
        font-size: 23px;
        line-height: 1.5;
        color: #cbd5e1;
        font-weight: 500;
        max-width: 540px;
      }
      .tag b { color: #fff; font-weight: 700; }

      .pills {
        margin-top: 34px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 11px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 17px;
        font-weight: 700;
        color: #e2e8f0;
        backdrop-filter: blur(6px);
      }
      .pill .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .foot {
        margin-top: 44px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 18px;
        font-weight: 700;
        color: #94a3b8;
      }
      .foot .url {
        color: #fff;
        background: rgba(242, 75, 56, 0.16);
        border: 1px solid rgba(242, 75, 56, 0.4);
        padding: 8px 16px;
        border-radius: 10px;
      }

      /* product shot */
      .shot {
        position: absolute;
        right: -70px;
        top: 50%;
        transform: translateY(-50%) perspective(1600px) rotateY(-16deg) rotateX(4deg) rotate(1.5deg);
        width: 720px;
        border-radius: 16px;
        overflow: hidden;
        background: #0f172a;
        box-shadow:
          0 50px 100px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.08);
        z-index: 2;
      }
      .shot .bar {
        height: 42px;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
      }
      .shot .bar .d { width: 12px; height: 12px; border-radius: 50%; }
      .shot .bar .addr {
        margin-left: 14px;
        flex: 1;
        height: 22px;
        background: #fff;
        border-radius: 7px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 600;
        color: #64748b;
      }
      .shot img {
        display: block;
        width: 100%;
        vertical-align: bottom;
      }
      .glow {
        position: absolute;
        right: 120px;
        top: 50%;
        width: 420px;
        height: 420px;
        transform: translateY(-50%);
        background: radial-gradient(circle, rgba(242, 75, 56, 0.35), transparent 65%);
        filter: blur(30px);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <div class="glow"></div>
      <div class="shot">
        <div class="bar">
          <span class="d" style="background:#ff5f57"></span>
          <span class="d" style="background:#febc2e"></span>
          <span class="d" style="background:#28c840"></span>
          <span class="addr">pdf-studio.vercel.app</span>
        </div>
        <img src="screenshot.png" alt="PDF Studio" />
      </div>

      <div class="left">
        <div class="brand">
          <svg class="mark" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="15" fill="#f24b38" />
            <path d="M20 13h15l11 11v27a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z" fill="#fff" />
            <path d="M35 13v9a2 2 0 0 0 2 2h9z" fill="#ffc9c0" />
            <path d="M42 38a10 10 0 1 1-3-7.1" fill="none" stroke="#f24b38" stroke-width="3.2" stroke-linecap="round" />
            <path d="M42 28v5h-5" fill="none" stroke="#f24b38" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="name">PDF <b>Studio</b></span>
        </div>

        <h1>
          합치고 · 자르고<br />
          <span class="accent">돌리고.</span>
        </h1>
        <p class="tag">
          브라우저에서 바로 끝내는 PDF 편집.<br />
          파일은 <b>서버로 전송되지 않습니다.</b>
        </p>

        <div class="pills">
          <span class="pill"><span class="dot" style="background:#ff6b57"></span>합치기 · 분할</span>
          <span class="pill"><span class="dot" style="background:#38bdf8"></span>페이지 회전</span>
          <span class="pill"><span class="dot" style="background:#34d399"></span>100% 로컬 처리</span>
        </div>

        <div class="foot">
          <span class="url">pdf-studio.vercel.app</span>
          <span>No upload · No server</span>
        </div>
      </div>
    </div>
  </body>
</html>
